<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>HS TECH Overlay</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
    body { font: 600 13px/1.2 var(--font-sans); color: var(--ui-text); }
    #box { display: inline-block; width: 252px; padding: var(--space-3); border-radius: var(--radius-xl); transform-origin: top left;
      border: 1px solid var(--ui-border-accented); }
    .up { text-transform: uppercase; letter-spacing: .05em; }

    /* FPS */
    .game { font-size: 11px; color: var(--ui-text-muted); margin: 0 0 var(--space-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fps { display: flex; align-items: flex-end; gap: var(--space-2); }
    .fps .lbl { font-size: var(--text-lg); font-weight: 800; color: var(--ui-text-highlighted); padding-bottom: 3px; }
    .fps .num { font-size: 40px; font-weight: 800; line-height: .9; letter-spacing: -.02em; color: var(--ui-primary); font-variant-numeric: tabular-nums; }
    .fps .side { margin-left: auto; text-align: right; font-size: 11px; color: var(--ui-text-muted); }
    .fps-msg { font-size: 11px; line-height: 1.35; color: var(--ui-text-muted); margin-top: 2px; }
    .fps-msg.err { color: #ffb020; }
    .game .src { font-size: 9px; color: var(--ui-text-dimmed, var(--ui-text-muted)); letter-spacing: .05em; }
    .fps .side b { color: var(--ui-text-highlighted); font-size: 13px; }
    .ft { display: flex; justify-content: space-between; font-size: 11px; color: var(--ui-text-muted); margin-top: var(--space-1); }
    .ft b { color: var(--ui-text-highlighted); }
    canvas { display: block; margin: var(--space-1) 0 2px; }

    /* Blocos de hardware */
    .blk { margin-top: var(--space-3); }
    .head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); font-size: 13.5px; }
    .head .name { color: var(--ui-text-highlighted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .head .val { color: var(--ui-text-highlighted); font-weight: 700; font-variant-numeric: tabular-nums; }
    .track { height: 6px; margin-top: var(--space-1); border-radius: var(--radius-full); background: var(--ui-bg-accented); overflow: hidden; }
    .track .fill { height: 100%; border-radius: var(--radius-full); background: var(--ui-primary); transition: width var(--dur-medium) var(--ease-out); }
    .ram .track .fill { background: var(--ui-text-muted); }
    .sub { display: flex; justify-content: space-between; font-size: 11px; color: var(--ui-text-muted); margin-top: var(--space-1); }
    .stats { display: flex; gap: var(--space-3); margin-top: var(--space-1); font-size: 13px; color: var(--ui-text-highlighted); font-variant-numeric: tabular-nums; }
    .c-ok { color: var(--ui-success); } .c-warn { color: var(--ui-warning); } .c-bad { color: var(--ui-error); }
    .net { display: flex; justify-content: space-between; margin-top: var(--space-3); padding-top: var(--space-2); border-top: 1px solid var(--ui-border); font-size: 12px; color: var(--ui-text-highlighted); }
    .net .k { color: var(--ui-text-muted); }

    /* Marca */
    .brand { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: var(--space-2); font-size: 11px; font-weight: 800; letter-spacing: .2em; color: var(--ui-text-highlighted); }
    .brand img { width: 14px; height: 14px; }
    .brand .tech { color: var(--ui-primary); }
  </style>
</head>
<body>
  <div id="box"></div>
  <script src="js/overlay.js"></script>
</body>
</html>
