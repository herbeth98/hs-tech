<!doctype html><html><head><meta charset="utf-8"><title>Teste de FPS</title>
<style>html,body{margin:0;height:100%;background:#0a0d14;overflow:hidden}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');
function f(t){c.width=innerWidth;c.height=innerHeight;for(let i=0;i<40;i++){x.fillStyle=`hsl(${(t/10+i*9)%360},80%,60%)`;x.fillRect((Math.sin(t/400+i)*.45+.5)*c.width,(Math.cos(t/530+i*1.3)*.45+.5)*c.height,30,30);}requestAnimationFrame(f);}
requestAnimationFrame(f);
</script></body></html>
