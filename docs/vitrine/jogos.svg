    </g><text x="70" y="120" font-size="17" font-weight="700" letter-spacing="2.2" fill="#00DC82">SEUS JOGOS</text><text x="70" y="176" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#f5f5f7">Ele acha seus jogos</text><text x="70" y="228" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#f5f5f7">sozinho.</text><text x="70" y="298" font-size="22" fill="#a1a1aa">Steam, Epic, Xbox e outras lojas.</text><text x="70" y="331" font-size="22" fill="#a1a1aa">Para cada jogo, você escolhe os</text><text x="70" y="364" font-size="22" fill="#a1a1aa">núcleos, a prioridade e a placa de</text><text x="70" y="397" font-size="22" fill="#a1a1aa">vídeo. Vale só para aquele jogo.</text><clipPath id="capa0"><rect x="660" y="40" width="156" height="96" rx="12"/></clipPath><g clip-path="url(#capa0)"><rect x="660" y="40" width="156" height="96" fill="#3b1d4f"/><circle cx="769.2" cy="73.6" r="21.12" fill="#ff7ab6" opacity=".8"/><path d="M660 136 L714.6 83.2 L753.6 116.80000000000001 L784.8 92.80000000000001 L816 121.6 V136Z" fill="#1c0d29"/></g><rect class="a sel" x="657" y="37" width="162" height="102" rx="14" fill="none" stroke="#00DC82" stroke-width="3"/><text x="664" y="160" font-size="15" fill="#f5f5f7">Jogo de tiro</text><clipPath id="capa1"><rect x="832" y="40" width="156" height="96" rx="12"/></clipPath><g clip-path="url(#capa1)"><rect x="832" y="40" width="156" height="96" fill="#0f3b3a"/><path d="M910.0 54.4 L847.6 136 H972.4Z" fill="#1d5f5c"/><path d="M910.0 68.8 V136" stroke="#ffd54f" stroke-width="3" stroke-dasharray="8 8"/></g><text x="836" y="160" font-size="15" fill="#a1a1aa">Corrida</text><clipPath id="capa2"><rect x="1004" y="40" width="156" height="96" rx="12"/></clipPath><g clip-path="url(#capa2)"><rect x="1004" y="40" width="156" height="96" fill="#3a2a12"/><circle cx="1043.0" cy="68.8" r="15.36" fill="#ffb020" opacity=".85"/><path d="M1004 112.0 Q1066.4 92.80000000000001 1160 107.19999999999999 V136 H1004Z" fill="#5d4520"/><path d="M1105.4 107.