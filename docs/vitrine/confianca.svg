-linejoin="round"/><text x="487.0" y="397" font-size="16" fill="#f5f5f7">Sem drivers escondidos</text><rect x="711.0" y="370" width="290" height="42" rx="21" fill="#ffffff" fill-opacity=".05" stroke="#fff" stroke-opacity=".12"/><circle cx="735.0" cy="391" r="8" fill="#00DC82" fill-opacity=".18" stroke="#00DC82" stroke-width="1.6"/><path d="M731.4 391 l2.56 2.72 l4.8 -5.44" fill="none" stroke="#00DC82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="753.0" y="397" font-size="16" fill="#f5f5f7">Sem anúncios e sem cadastro</text></svg>
