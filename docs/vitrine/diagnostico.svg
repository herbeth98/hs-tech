<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><style>
    text { font-family: 'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
    .a { transform-box: fill-box; transform-origin: center; }
    @keyframes deriva1 { 50% { transform: translate(60px, -30px) scale(1.12); } }
    @keyframes deriva2 { 50% { transform: translate(-70px, 40px) scale(.92); } }
    @keyframes deriva3 { 50% { transform: translate(40px, 50px) scale(1.08); } }
    .b1 { animation: deriva1 18s ease-in-out infinite; }
    .b2 { animation: deriva2 22s ease-in-out infinite; }
    .b3 { animation: deriva3 26s ease-in-out infinite; }
    
@keyframes varre { 0% { transform: translateY(0); opacity: 0; } 5% { opacity: .8; } 40% { transform: translateY(315px); opacity: .8; } 44%, 100% { transform: translateY(315px); opacity: 0; } }
@keyframes marca { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
@keyframes conclui { 0%, 30% { opacity: 0; transform: translateX(16px); } 40%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
.varre { transform-box: view-box; animation: varre 7s ease-in-out infinite; }
.marca { animation: marca 2.2s ease-in-out infinite; }
.conclui { animation: conclui 7s cubic-bezier(.2,.8,.2,1) infinite both; animation-delay: -3.5s; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; }  }</style>
    <defs>
      <linearGradient id="f1200x470" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070a14"/><stop offset="1" stop-color="#0c1630"/></linearGradient>
      <filter id="nevf1200x470" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
      <clipPath id="cf1200x470"><rect width="1200" height="470" rx="28"/></clipPath>
    </defs>
    <g clip-path="url(#cf1200x470)">
      <rect width="1200" height="470" fill="url(#f1200x470)"/>
      <g filter="url(#nevf1200x470)" opacity="0.3">
        <circle class="a b1" cx="180.0" cy="94.0" r="197.4" fill="#ffb020"/>
        <circle class="a b2" cx="1020.0" cy="117.5" r="169.2" fill="#6366f1"/>
        <circle class="a b3" cx="720.0" cy="446.5" r="188.0" fill="#00DC82" opacity=".7"/>
      </g>
      <rect width="1200" height="470" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
    </g><text x="650" y="120" font-size="17" font-weight="700" letter-spacing="2.2" fill="#00DC82">QUANDO ALGO DÁ ERRADO</text><text x="650" y="176" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#f5f5f7">Ele conta o que</text><text x="650" y="228" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#f5f5f7">aconteceu.</text><text x="650" y="298" font-size="22" fill="#a1a1aa">O PC desligou sozinho? Ele lê os</text><text x="650" y="331" font-size="22" fill="#a1a1aa">registros do Windows, diz o motivo</text><text x="650" y="364" font-size="22" fill="#a1a1aa">provável e o que fazer, em ordem.</text><rect x="80" y="40" width="270" height="390" rx="18" fill="#11152a" stroke="#ffffff" stroke-opacity=".09"/><text x="104" y="74" font-size="15" font-weight="600" fill="#f5f5f7">Registros do Windows</text><rect x="113" y="110" width="2" height="250" fill="#fff" fill-opacity=".1"/><circle cx="114" cy="112" r="6" fill="#5b6283"/><text x="134" y="110" font-size="13" font-weight="700" fill="#a1a1aa">21:02</text><text x="134" y="130" font-size="16" fill="#a1a1aa">Jogo aberto</text><circle cx="114" cy="174" r="6" fill="#5b6283"/><text x="134" y="172" font-size="13" font-weight="700" fill="#a1a1aa">21:40</text><text x="134" y="192" font-size="16" fill="#a1a1aa">Tudo normal</text><rect class="marca" x="94" y="216" width="238" height="48" rx="10" fill="#ffb020" fill-opacity=".12" stroke="#ffb020" stroke-width="1.6"/><circle cx="114" cy="236" r="6" fill="#ffb020"/><text x="134" y="234" font-size="13" font-weight="700" fill="#ffb020">22:13</text><text x="134" y="254" font-size="16" fill="#f5f5f7">Desligou de repente</text><circle cx="114" cy="298" r="6" fill="#5b6283"/><text x="134" y="296" font-size="13" font-weight="700" fill="#a1a1aa">22:14</text><text x="134" y="316" font-size="16" fill="#a1a1aa">Windows iniciou</text><circle cx="114" cy="360" r="6" fill="#5b6283"/><text x="134" y="358" font-size="13" font-weight="700" fill="#a1a1aa">22:14</text><text x="134" y="378" font-size="16" fill="#a1a1aa">Sem tela azul</text><clipPath id="reg"><rect x="80" y="90" width="270" height="320"/></clipPath><g clip-path="url(#reg)"><rect class="varre" x="80" y="90" width="270" height="3" fill="#22d3ee" opacity=".8"/></g><g class="conclui"><rect x="366" y="80" width="214" height="310" rx="18" fill="#11152a" stroke="#ffffff" stroke-opacity=".09"/><text x="386" y="114" font-size="14" fill="#a1a1aa">Motivo provável</text><text x="386" y="146" font-size="22" font-weight="700" fill="#f5f5f7">Queda de energia</text><text x="386" y="172" font-size="14" fill="#a1a1aa">O PC desligou sem aviso</text><text x="386" y="191" font-size="14" fill="#a1a1aa">e sem erro do Windows.</text><rect x="386" y="210" width="174" height="1" fill="#fff" fill-opacity=".1"/><text x="386" y="240" font-size="14" font-weight="600" fill="#00DC82">O que fazer</text><circle cx="397" cy="267" r="11" fill="#00DC82" fill-opacity=".16"/><text x="397" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#00DC82">1</text><text x="416" y="272" font-size="15" fill="#f5f5f7">Confira a tomada</text><circle cx="397" cy="301" r="11" fill="#00DC82" fill-opacity=".16"/><text x="397" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#00DC82">2</text><text x="416" y="306" font-size="15" fill="#f5f5f7">Teste sem o filtro</text><circle cx="397" cy="335" r="11" fill="#00DC82" fill-opacity=".16"/><text x="397" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#00DC82">3</text><text x="416" y="340" font-size="15" fill="#f5f5f7">Veja a fonte do PC</text></g></svg>
