    </g><text x="650" y="120" font-size="17" font-weight="700" letter-spacing="2.2" fill="#00DC82">POR CIMA DO JOGO</text><text x="650" y="176" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#f5f5f7">Seu FPS na tela,</text><text x="650" y="228" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#f5f5f7">sem atrapalhar.</text><text x="650" y="298" font-size="22" fill="#a1a1aa">Um painel pequeno mostra o FPS, o 1% low,</text><text x="650" y="331" font-size="22" fill="#a1a1aa">a CPU, a placa de vídeo e o ping</text><text x="650" y="364" font-size="22" fill="#a1a1aa">enquanto você joga. Um atalho</text><text x="650" y="397" font-size="22" fill="#a1a1aa">mostra e esconde.</text><defs><linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2b55"/><stop offset="1" stop-color="#4a6aa0"/></linearGradient></defs><clipPath id="jogo"><rect x="80" y="55" width="500" height="360" rx="18"/></clipPath><g clip-path="url(#jogo)"><rect x="80" y="55" width="500" height="360" fill="url(#ceu)"/><circle cx="460" cy="175" r="38" fill="#ffd38a" opacity=".85"/><g class="nuvem"><ellipse cx="230" cy="135" rx="60" ry="14" fill="#fff" opacity=".18"/><ellipse cx="500" cy="115" rx="44" ry="10" fill="#fff" opacity=".14"/></g><path d="M80 305 L170 225 L250 285 L340 205 L450 295 L520 245 L580 285 V415 H80Z" fill="#2c3d66"/><path d="M80 345 Q230 305 340 340 T580 325 V415 H80Z" fill="#1a2440"/><rect x="380" y="270" width="46" height="80" fill="#121a30"/><rect x="430" y="290" width="34" height="60" fill="#0f1628"/><rect x="392" y="285" width="8" height="8" fill="#ffd38a" opacity=".7"/><rect x="406" y="305" width="8" height="8" fill="#ffd38a" opacity=".5"/><path d="M316.0 235.0 h9 M335.0 235.0 h9 M330.0 221.0 v9 M330.0 240.0 v9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><rect x="96" y="71" width="196" height="186" rx="12" fill="#050814" fill-opacity=".84" stroke="#00DC82" stroke-opacity=".45"/><text x="110" y="95" font-size="12" font-wei