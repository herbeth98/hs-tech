    </g><text x="650" y="120" font-size="17" font-weight="700" letter-spacing="2.2" fill="#00DC82">LIMPEZA</text><text x="650" y="176" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#f5f5f7">Espaço de volta e</text><text x="650" y="228" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#f5f5f7">memória mais leve.</text><text x="650" y="298" font-size="22" fill="#a1a1aa">Apaga temporários, caches e restos</text><text x="650" y="331" font-size="22" fill="#a1a1aa">de atualização. A memória RAM</text><text x="650" y="364" font-size="22" fill="#a1a1aa">também é liberada sem fechar</text><text x="650" y="397" font-size="22" fill="#a1a1aa">nenhum programa.</text><circle cx="210" cy="215" r="100" fill="none" stroke="#262b45" stroke-width="26"/><circle class="disco" style="animation-delay: -4.2s" cx="210" cy="215" r="100" pathLength="100" stroke-dasharray="100" stroke-dashoffset="36" transform="rotate(-90 210 215)" fill="none" stroke="url(#discog)" stroke-width="26" stroke-linecap="round"/><defs><linearGradient id="discog" x1="0" x2="1"><stop offset="0" stop-color="#00DC82"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><text x="210" y="197" text-anchor="middle" font-size="15" fill="#a1a1aa">Disco C:</text><text class="antes" style="animation-delay: -4.2s" x="210" y="237" text-anchor="middle" font-size="40" font-weight="700" fill="#f5f5f7">82%</text><text class="depois" style="animation-delay: -4.2s" x="210" y="237" text-anchor="middle" font-size="40" font-weight="700" fill="#f5f5f7">64%</text><text x="210" y="261" text-anchor="middle" font-size="14" fill="#a1a1aa">usado</text><g class="depois" style="animation-delay: -4.2s"><rect x="110" y="343" width="200" height="40" rx="20" fill="#00DC82" fill-opacity=".14" stroke="#00DC82" stroke-opacity=".5"/><text x="210" y="369" text-anchor="middle" font-size="16" font-weight="600" fill="#00DC82">18,4 GB liberados</text></g><rect x="350" y="50" width="230" height="120" rx="18" fill="#11152a" stroke="#ffffff" stroke-opacity=".09"/><text x="370" y="82" font-size="15" fill="#a1a1aa">Memória RAM</text><text class="antes" style="animation-delay: -4.2s" x="560" y="83" text-anchor="end" font-size="20" font-weight="700" fill="#f5f5f7">78%</text><text class="depois" style="animation-delay: -4.2s" x="560" y="83" text-anchor="end" font-size="20" font-weight="700" fill="#f5f5f7">41%</text><rect x="370" y="108" width="190" height="14" rx="7" fill="#262b45"/><rect class="ram" style="animation-delay: -4.2s" x="370" y="108" width="78" height="14" rx="7" fill="#a78bfa"/><text x="370" y="148" font-size="13" fill="#a1a1aa">Sem fechar seus programas</text><rect x="350" y="190" width="230" height="240" rx="18" fill="#11152a" stroke="#ffffff" stroke-opacity=".09"/><text x="370" y="222" font-size="15" font-weight="600" fill="#f5f5f7">Limpo agora</text><g class="item" style="animation-delay: -4.20s"><circle cx="380" cy="257" r="8" fill="#00DC82" fill-opacity=".18" stroke="#00DC82" stroke-width="1.6"/><path d="M376.4 257 l2.56 2.72 l4.8 -5.44" fill="none" stroke="#00DC82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="396" y="262" font-size="15" fill="#a1a1aa">Temporários</text><text x="560" y="262" text-anchor="end" font-size="15" font-weight="600" fill="#f5f5f7">9,2 GB</text></g><g class="item" style="animation-delay: -3.85s"><circle cx="380" cy="299" r="8" fill="#00DC82" fill-opacity=".18" stroke="#00DC82" stroke-width="1.6"/><path d="M376.4 299 l2.56 2.72 l4.8 -5.44" fill="none" stroke="#00DC82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="396" y="304" font-size="15" fill="#a1a1aa">Cache</text><text x="560" y="304" text-anchor="end" font-size="15" font-weight="600" fill="#f5f5f7">5,1 GB</text></g><g class="item" style="animation-delay: -3.50s"><circle cx="380" cy="341" r="8" fill="#00DC82" fill-opacity=".18" stroke="#00DC82" stroke-width="1.6"/><path d="M376.4 341 l2.56 2.72 l4.8 -5.44" fill="none" stroke="#00DC82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="396" y="346" font-size="15" fill="#a1a1aa">Logs antigos</text><text x="560" y="346" text-anchor="end" font-size="15" font-weight="600" fill="#f5f5f7">2,6 GB</text></g><g class="item" style="animation-delay: -3.15s"><circle cx="380" cy="383" r="8" fill="#00DC82" fill-opacity=".18" stroke="#00DC82" stroke-width="1.6"/><path d="M376.4 383 l2.56 2.72 l4.8 -5.44" fill="none" stroke="#00DC82" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="396" y="388" font-size="15" fill="#a1a1aa">Lixeira</text><text x="560" y="388" text-anchor="end" font-size="15" font-weight="600" fill="#f5f5f7">1,5 GB</text></g></svg>
